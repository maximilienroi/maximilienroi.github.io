# Builds the site and publishes it on GitHub Pages.
# Runs: on every change to main, every hour (to pick up Notion changes),
# and on demand (Actions tab > Publish site > Run workflow).
name: Publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Get the latest content from Notion
        if: env.NOTION_TOKEN != ''
        run: npm run sync

      - name: Save the Notion content in the repository
        if: env.NOTION_TOKEN != ''
        run: |
          git add src/content src/assets/notion public/media/notion
          if git diff --cached --quiet; then
            echo "No changes from Notion."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update content from Notion"
            git push
          fi

      - name: Read the Pages address
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build
        env:
          SITE: ${{ steps.pages.outputs.origin }}
          BASE: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
